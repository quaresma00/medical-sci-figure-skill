[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "medfigure"
version = "2.0.0"
description = "Universal medical SCI paper figure generation guidelines, decision grammar, and automated QA engine for AI agents (NEJM, Lancet, JAMA, Nature Medicine standards)."
readme = "README.md"
authors = [{ name = "quaresma00" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "adjustText>=1.1.0"
]

[project.urls]
Homepage = "https://github.com/quaresma00/medical-sci-figure-skill"
Repository = "https://github.com/quaresma00/medical-sci-figure-skill"
